<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 400" role="img" aria-labelledby="title desc">
<title id="title">A decision tree and the Boolean cube</title>
<desc id="desc">Three binary questions about glasses, a hat, and blue eyes give eight answer sequences. Each leaf is matched by colour and binary label to a vertex of the three-dimensional Boolean cube. No is zero; yes is one.</desc>
